<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>牛牛爱学习 by Mr.Chen</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { border-radius: 25px; overflow: hidden; background: transparent; }
    body { width: 340px; margin: 0; color: #26343b; font-family: "Microsoft YaHei", sans-serif; font-size: 12px; }
    .app-shell { overflow: hidden; border-radius: 25px; background: #f2f6f7; }
    .header { position: relative; overflow: hidden; padding: 13px 15px 12px; background: linear-gradient(135deg, #0f766e 0%, #155e75 100%); color: #fff; }
    .header::before { content: ""; position: absolute; width: 108px; height: 108px; right: -38px; top: -58px; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; box-shadow: 0 0 0 13px rgba(255,255,255,.05), 0 0 0 26px rgba(255,255,255,.035); }
    .header-top { position: relative; display: flex; align-items: center; justify-content: space-between; }
    .brand { position: relative; display: flex; align-items: center; gap: 8px; }
    .brand-copy { display: flex; align-items: baseline; gap: 6px; }
    .brand-icon { width: 32px; height: 32px; flex: 0 0 32px; overflow: hidden; border: 1px solid rgba(255,255,255,.28); border-radius: 10px; background: rgba(255,255,255,.14); box-shadow: 0 5px 12px rgba(8,47,73,.2); }
    .brand-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .header .title { font-family: "PingFang SC", "Avenir Next", "Microsoft YaHei", sans-serif; font-weight: 800; font-size: 16px; line-height: 1.1; letter-spacing: .7px; text-shadow: 0 1px 2px rgba(7,45,55,.18); }
    .header .author { font-size: 10px; font-weight: 400; letter-spacing: .15px; opacity: .8; }
    .settings-button { width: 30px; min-width: 30px; min-height: 30px; padding: 5px; border-color: rgba(255,255,255,.25); border-radius: 9px; background: rgba(255,255,255,.12); box-shadow: none; }
    .settings-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .body { padding: 10px 12px 11px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 7px 9px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1px; color: #fff; transition: transform .16s ease, box-shadow .16s ease, filter .16s ease, opacity .16s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); filter: saturate(1.08); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgba(49,89,232,.22); outline-offset: 2px; }
    #start { background: linear-gradient(135deg, #0f766e, #0d9488); box-shadow: 0 6px 12px rgba(15,118,110,.2); }
    #stop { background: linear-gradient(135deg, #b84b60, #d96a70); box-shadow: 0 6px 12px rgba(184,75,96,.16); }
    button:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .button-icon { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid rgba(255,255,255,.28); border-radius: 5px; background: rgba(255,255,255,.14); }
    .button-icon svg { width: 10px; height: 10px; fill: currentColor; }
    .progress-card { margin-bottom: 10px; padding: 9px 10px 8px; border: 1px solid #dbe7e7; border-radius: 12px; background: #fff; box-shadow: 0 4px 10px rgba(30,71,77,.05); }
    .progress-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .progress-label { color: #809196; font-size: 10px; font-weight: 700; letter-spacing: .4px; }
    #progress-text { margin: 0; color: #38525a; font-size: 11px; font-weight: 700; }
    #progress-bar { height: 7px; overflow: hidden; border-radius: 99px; background: #eaf0f1; box-shadow: inset 0 1px 2px rgba(34,64,69,.08); }
    #progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #0f766e, #56b98e); box-shadow: 0 0 8px rgba(86,185,142,.3); transition: width .3s ease; }
    .log-card { padding: 9px 10px 8px; border: 1px solid #d3e0e1; border-radius: 16px; background: linear-gradient(145deg, #1d3440, #172a35); box-shadow: 0 6px 14px rgba(25,58,66,.13); }
    .log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; color: #f0f7f6; font-size: 11px; font-weight: 700; }
    .log-head-title { display: flex; align-items: center; gap: 7px; }
    .log-head-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #62d4a3; box-shadow: 0 0 0 3px rgba(98,212,163,.14); }
    .log-live { color: #9bb4b9; font-size: 9px; font-weight: 600; letter-spacing: .3px; }
    #log { height: 170px; overflow-y: auto; padding: 0 4px 0 0; color: #d9e8e7; font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: normal; box-sizing: border-box; scrollbar-color: #587882 transparent; scrollbar-width: thin; }
    #log > div { margin: 0; padding: 0; line-height: 1.35; }
    #log .log-instruction { color: #f3f9f8; font-weight: 700; }
    #log .log-ready { margin-top: 3px; color: #a9c0c1; }
    #log::-webkit-scrollbar { width: 6px; }
    #log::-webkit-scrollbar-thumb { border-radius: 99px; background: #587882; }
    #log::-webkit-scrollbar-track { background: transparent; }
    .hint { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; padding: 7px 8px; border: 1px solid #dbe7e7; border-radius: 10px; background: #fff; color: #7f9094; font-size: 10px; line-height: 1.35; box-shadow: 0 3px 9px rgba(30,71,77,.04); }
    .hint-icon { flex: 0 0 auto; font-size: 12px; line-height: 1.15; }
    .settings-head { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
    .settings-back { width: 30px; min-width: 30px; min-height: 30px; padding: 4px; border: 1px solid #d3e0e1; border-radius: 9px; background: #fff; color: #38525a; font-size: 18px; line-height: 1; box-shadow: none; }
    .settings-title { color: #38525a; font-size: 14px; font-weight: 800; }
    .settings-subtitle { margin-top: 2px; color: #8a9a9e; font-size: 10px; }
    .speed-options { display: grid; gap: 8px; }
    .speed-option { display: flex; align-items: flex-start; gap: 9px; padding: 10px; border: 1px solid #dbe7e7; border-radius: 11px; background: #fff; cursor: pointer; transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
    .speed-option:hover { transform: translateY(-1px); border-color: #8bc6bd; box-shadow: 0 4px 10px rgba(30,71,77,.07); }
    .speed-option:has(input:checked) { border-color: #36a997; box-shadow: 0 0 0 2px rgba(54,169,151,.12); }
    .speed-option input { margin: 2px 0 0; accent-color: #0f766e; }
    .speed-name { display: block; color: #38525a; font-size: 12px; font-weight: 800; }
    .speed-detail { display: block; margin-top: 3px; color: #829397; font-size: 10px; line-height: 1.45; }
    .speed-current { margin-top: 10px; padding: 8px 9px; border-radius: 9px; background: #eaf5f3; color: #38766f; font-size: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="app-shell">
  <div class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"><img src="icon.png" alt=""></div>
        <div class="brand-copy">
          <div class="title">牛牛爱学习</div>
          <div class="author">by Mr.Chen</div>
        </div>
      </div>
      <button id="settings-btn" class="settings-button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z"/><path d="m19.2 13.5 1.4 1.1-1.7 2.9-1.7-.7a7.5 7.5 0 0 1-1.8 1l-.3 1.8h-3.4l-.3-1.8a7.5 7.5 0 0 1-1.8-1l-1.7.7-1.7-2.9 1.4-1.1a7.7 7.7 0 0 1 0-2.1L6.2 10.3l1.7-2.9 1.7.7a7.5 7.5 0 0 1 1.8-1l.3-1.8h3.4l.3 1.8a7.5 7.5 0 0 1 1.8 1l1.7-.7 1.7 2.9-1.4 1.1a7.7 7.7 0 0 1 0 2.1Z"/></svg></button>
    </div>
  </div>
  <div class="body" id="main-view">
    <div class="btns">
      <button id="start"><span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1.2 1.2 0 0 0 1.85 1.01l10-6.8a1.2 1.2 0 0 0 0-2.02l-10-6.8A1.2 1.2 0 0 0 8 5.2Z"/></svg></span><span>开始学习</span></button>
      <button id="stop"><span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 7.8A1.8 1.8 0 0 1 8.8 6h6.4A1.8 1.8 0 0 1 17 7.8v8.4a1.8 1.8 0 0 1-1.8 1.8H8.8A1.8 1.8 0 0 1 7 16.2V7.8Z"/></svg></span><span>停止学习</span></button>
    </div>
    <div class="progress-card" id="progress-wrap">
      <div class="progress-head"><span class="progress-label">整体进度</span><div id="progress-text">总进度: 0/0 (0%)</div></div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <div class="log-card">
      <div class="log-head"><span class="log-head-title">执行日志</span><span class="log-live">实时输出</span></div>
      <div id="log"><div class="log-instruction">使用说明：</div><div class="log-step">1、进入视频播放页</div><div class="log-step">2、点开任一视频章节列表待其加载完成</div><div class="log-step">3、点击「开始学习」</div><div class="log-ready">等待检测结果...</div></div>
    </div>
    <div class="hint"><span class="hint-icon" aria-hidden="true">⚠️</span><span>非官方工具，仅用于学习交流，操作风险自行承担！</span></div>
  </div>
  <div class="body" id="settings-view" hidden>
    <div class="settings-head">
      <button id="settings-back" class="settings-back" aria-label="返回">‹</button>
      <div>
        <div class="settings-title">速度设置</div>
        <div class="settings-subtitle">新的任务将使用所选速度</div>
      </div>
    </div>
    <div class="speed-options">
      <label class="speed-option"><input type="radio" name="speed-mode" value="fast"><span><span class="speed-name">快速</span><span class="speed-detail">接口间隔随机 0.5–1.0 秒，每次增加 35–50 秒</span></span></label>
      <label class="speed-option"><input type="radio" name="speed-mode" value="balanced"><span><span class="speed-name">均衡</span><span class="speed-detail">接口间隔随机 1.0–1.5 秒，每次增加 25–40 秒</span></span></label>
      <label class="speed-option"><input type="radio" name="speed-mode" value="slow"><span><span class="speed-name">慢速</span><span class="speed-detail">接口间隔随机 1.0–2.0 秒，每次增加 10–30 秒</span></span></label>
    </div>
    <div id="speed-current" class="speed-current">当前速度：均衡</div>
  </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
